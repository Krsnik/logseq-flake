# Self-hosted Logseq: web app + sync server + publish service.
#
# Works with docker compose and podman-compose alike. The images are built by
# this flake, not pulled from a registry, and are generic: everything
# deployment-specific comes from the environment below, no rebuild needed.
#
#   nix build path:.#logseq-webapp-image  && podman load -i result
#   nix build path:.#logseq-sync-image    && podman load -i result
#   nix build path:.#logseq-publish-image && podman load -i result
#
# Then fill in these (a .env file beside this one works) and
# `docker compose up -d`. They have no defaults on purpose: falling back to
# upstream's Cognito pool and api.logseq.io is exactly what this packaging
# exists to avoid, so compose fails loudly instead.
#
#   LOGSEQ_OIDC_ISSUER=https://idp.example.org/realms/logseq
#   LOGSEQ_OIDC_CLIENT_ID=logseq
#   LOGSEQ_OIDC_JWKS_URL=https://idp.example.org/realms/logseq/protocol/openid-connect/certs
#   LOGSEQ_API_DOMAIN=notes.example.org
#   LOGSEQ_SYNC_HTTP_BASE=https://sync.example.org
#   LOGSEQ_SYNC_WS_URL=wss://sync.example.org/sync/%s
#   LOGSEQ_PUBLISH_API_BASE=https://blog.example.org
#
# Any OIDC provider that offers the device flow works, for the servers and the
# web app's sign-in alike — ./keycloak.nix is a worked Keycloak realm, and
# checks.sync/checks.login prove it end to end. LOGSEQ_API_DOMAIN is where the
# web app itself is reachable: it answers the client's user_info call. The
# full list of what the web app reads is ../modules/packages/_client-config.nix.
services:
  webapp:
    image: localhost/logseq-webapp:latest
    ports:
      - "8080:8080"
    environment:
      LOGSEQ_OIDC_ISSUER: ${LOGSEQ_OIDC_ISSUER:?set LOGSEQ_OIDC_ISSUER}
      LOGSEQ_OIDC_CLIENT_ID: ${LOGSEQ_OIDC_CLIENT_ID:?set LOGSEQ_OIDC_CLIENT_ID}
      LOGSEQ_API_DOMAIN: ${LOGSEQ_API_DOMAIN:?set LOGSEQ_API_DOMAIN}
      LOGSEQ_SYNC_HTTP_BASE: ${LOGSEQ_SYNC_HTTP_BASE:?set LOGSEQ_SYNC_HTTP_BASE}
      LOGSEQ_SYNC_WS_URL: ${LOGSEQ_SYNC_WS_URL:?set LOGSEQ_SYNC_WS_URL}
      LOGSEQ_PUBLISH_API_BASE: ${LOGSEQ_PUBLISH_API_BASE:?set LOGSEQ_PUBLISH_API_BASE}
    # nginx forks its workers with setuid, which cap_drop: ALL removes, so this
    # container starts unprivileged rather than dropping privileges itself.
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  sync:
    image: localhost/logseq-sync:latest
    ports:
      - "8081:8080"
    environment:
      COGNITO_ISSUER: ${LOGSEQ_OIDC_ISSUER:?set LOGSEQ_OIDC_ISSUER}
      COGNITO_CLIENT_ID: ${LOGSEQ_OIDC_CLIENT_ID:?set LOGSEQ_OIDC_CLIENT_ID}
      COGNITO_JWKS_URL: ${LOGSEQ_OIDC_JWKS_URL:?set LOGSEQ_OIDC_JWKS_URL}
    volumes:
      - sync-data:/var/lib/logseq-sync
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
  publish:
    image: localhost/logseq-publish:latest
    ports:
      - "8082:8787"
    environment:
      COGNITO_ISSUER: ${LOGSEQ_OIDC_ISSUER:?set LOGSEQ_OIDC_ISSUER}
      COGNITO_CLIENT_ID: ${LOGSEQ_OIDC_CLIENT_ID:?set LOGSEQ_OIDC_CLIENT_ID}
      COGNITO_JWKS_URL: ${LOGSEQ_OIDC_JWKS_URL:?set LOGSEQ_OIDC_JWKS_URL}
      # The worker serves published pages and assets itself; the only route that
      # hands out a presigned R2 URL is GET /pages/:graph/:page/transit, and
      # local workerd has no R2 endpoint to sign for. Placeholders keep the
      # signing code happy — same as the existing container deployment.
      R2_ACCOUNT_ID: local
      R2_BUCKET: logseq-publish-local
      R2_ACCESS_KEY_ID: local
      R2_SECRET_ACCESS_KEY: local
    volumes:
      - publish-data:/var/lib/logseq-publish
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
volumes:
  sync-data:
  publish-data:
